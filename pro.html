<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galerie de photos interactive et accessible</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #263238;
        }

        p {
            color: #555;
        }

        #image {
            width: 600px;
            height: 350px;
            margin: 25px auto;
            border: 3px solid #333;
            border-radius: 12px;
            background-color: white;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            font-size: 22px;
            font-weight: bold;
        }

        .gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        figure {
            margin: 0;
            width: 250px;
            background-color: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        figure img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }

        figure:focus {
            outline: 4px solid #007bff;
            outline-offset: 4px;
        }

        figcaption {
            padding: 10px;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            #image {
                width: 90%;
                height: 250px;
            }
        }
    </style>
</head>

<body onload="addTabIndex()">

    <h1>Ma galerie de photos interactive</h1>

    <p>
        Passez la souris sur une image ou utilisez la touche Tab
        pour découvrir les photos.
    </p>

    <div id="image" aria-live="polite">
        Sélectionnez une image pour l'afficher ici.
    </div>

    <div class="gallery">

        <figure onmouseover="upDate(this)"
                onmouseleave="unDo()"
                onfocus="upDate(this)"
                onblur="unDo()">

            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800"
                 alt="Magnifique paysage naturel avec des montagnes et une vallée">

            <figcaption>Paysage naturel</figcaption>
        </figure>

        <figure onmouseover="upDate(this)"
                onmouseleave="unDo()"
                onfocus="upDate(this)"
                onblur="unDo()">

            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"
                 alt="Belle plage avec du sable blanc et une mer turquoise">

            <figcaption>La plage</figcaption>
        </figure>

        <figure onmouseover="upDate(this)"
                onmouseleave="unDo()"
                onfocus="upDate(this)"
                onblur="unDo()">

            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800"
                 alt="Lac entouré de montagnes et de forêts">

            <figcaption>Le lac</figcaption>
        </figure>

        <figure onmouseover="upDate(this)"
                onmouseleave="unDo()"
                onfocus="upDate(this)"
                onblur="unDo()">

            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800"
                 alt="Forêt verte avec de grands arbres et un chemin naturel">

            <figcaption>La forêt</figcaption>
        </figure>

        <figure onmouseover="upDate(this)"
                onmouseleave="unDo()"
                onfocus="upDate(this)"
                onblur="unDo()">

            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800"
                 alt="Montagne enneigée sous un ciel étoilé">

            <figcaption>Montagne étoilée</figcaption>
        </figure>

        <figure onmouseover="upDate(this)"
                onmouseleave="unDo()"
                onfocus="upDate(this)"
                onblur="unDo()">

            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800"
                 alt="Lever du soleil sur un paysage naturel">

            <figcaption>Lever du soleil</figcaption>
        </figure>

    </div>

    <script>

        // Fonction appelée lorsque la souris passe sur une image
        function upDate(element) {

            console.log("Mouse over / Focus event");

            let img = element.querySelector("img");

            document.getElementById("image").style.backgroundImage =
                "url('" + img.src + "')";

            document.getElementById("image").textContent = img.alt;
        }

        // Fonction appelée lorsque la souris quitte une image
        // ou lorsque l'élément perd le focus
        function unDo() {

            console.log("Mouse leave / Blur event");

            document.getElementById("image").style.backgroundImage = "none";

            document.getElementById("image").textContent =
                "Sélectionnez une image pour l'afficher ici.";
        }

        // Fonction appelée au chargement de la page
        function addTabIndex() {

            console.log("Page loaded - Adding tabindex");

            let figures = document.querySelectorAll("figure");

            for (let i = 0; i < figures.length; i++) {

                figures[i].setAttribute("tabindex", "0");

            }
        }

    </script>

</body>
</html>
